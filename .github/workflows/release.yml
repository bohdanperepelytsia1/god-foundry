# Публікуєш реліз з тегом vX.Y.Z (на GitHub: Releases → Draft a new release) —
# робочий процес проганяє тести, збирає god.zip (system.json у корені архіву)
# і прикріплює god.zip та system.json до релізу. Foundry встановлює й оновлює
# систему за посиланням на маніфест останнього релізу.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Посилання в system.json (версія має збігатися з тегом)
        run: node build/manifest.mjs "${TAG#v}"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Архів системи
        run: |
          cd god
          zip -qr ../god.zip . -x 'packs/*/LOG*' 'packs/*/LOCK'
          cd ..
          cp god/system.json system.json

      - name: Файли до релізу
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" god.zip system.json --clobber
